name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    env:
      GRADLENEW_CONTAINER_TOOL: docker
      IMAGE: ghcr.io/eskatos/gradle-new
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: enhanced
      - name: Build, then test the image with both acceptance journeys
        run: ./gradlew build :build-logic:check -Pplaywright.withDeps=true --continue
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
            acceptance/build/screenshots/
          if-no-files-found: ignore
          retention-days: 14
      - name: Push the tested image
        id: push
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          local_ref="$(cat server/build/image/image-ref.txt)"
          tag="${local_ref##*:}"
          case "$tag" in
            *dirty*) echo "The image was built from a dirty working tree ($tag); not publishing it."; exit 1 ;;
          esac
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker tag "$local_ref" "$IMAGE:$tag"
          docker push "$IMAGE:$tag"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$tag")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "digest=${digest#*@}" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Record the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.push.outputs.tag }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists."
            exit 0
          fi
          {
            echo "Image \`$IMAGE:$TAG\`, digest \`$DIGEST\`."
            echo
            echo "Offered Gradle versions:"
            echo
            grep -E '^(stable|rc|previous)=' offered-gradle-versions.properties | sed -e 's/^\(.*\)=$/- \1: none/' -e 's/^\(.*\)=\(.*\)$/- \1: \2/'
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
