gradle.rootProject { root ->
    def dir = root.projectDir
    def target = gradle.startParameter.systemPropertiesArgs['gradlenew.fault.type']
    root.tasks.matching { it.name == 'init' }.configureEach { task ->
        task.doLast {
            if (task.type == target) {
                new File(dir, 'JAVA_VERSION.txt').text = "targets Java ${task.javaVersion.get()}\n"
            }
        }
    }
}
