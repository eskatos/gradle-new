<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>gradle-new link preview</title>
<link rel="stylesheet" href="assets/tokens/fonts.css">
<link rel="stylesheet" href="assets/tokens/colors.css">
<link rel="stylesheet" href="assets/tokens/typography.css">
<style>
  html, body { margin: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden; box-sizing: border-box;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 64px 80px 56px;
    background: var(--surface-dark);
    font-family: var(--font-sans); color: var(--text-inverse);
    border-bottom: 12px solid transparent;
    border-image: var(--gradle-gradient) 1;
  }
  .lockup { display: flex; align-items: center; gap: 20px; }
  .lockup .gradle { height: 64px; }
  .lockup .by { color: var(--neutral-300); font-size: 30px; }
  .lockup .develocity { height: 40px; }
  h1 { margin: 0 0 24px; font-family: var(--font-display); font-weight: 700; font-size: 128px; line-height: 1; letter-spacing: -0.02em; }
  p { margin: 0; max-width: 960px; font-size: 40px; line-height: 1.3; color: var(--neutral-200); }
  .address { font-family: var(--font-mono); font-size: 32px; color: var(--gradle-teal); }
</style>
</head>
<body>
  <div class="lockup">
    <img class="gradle" src="assets/logo/gradle-logo-light.svg" alt="Gradle">
    <span class="by">by</span>
    <img class="develocity" src="assets/logo/develocity-logo-landscape-color-dark.svg" alt="Develocity">
  </div>
  <div>
    <h1>gradle-new</h1>
    <p>Create a new Gradle project in your browser, with one HTTP request or from your coding agent.</p>
  </div>
  <div class="address">gradle-new.nosphere.org</div>
</body>
</html>
